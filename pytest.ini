[pytest]
# pytest-django resolves the settings module as: --ds option, then the
# DJANGO_SETTINGS_MODULE environment variable, then this ini value. Containers
# export DJANGO_SETTINGS_MODULE=config.settings.development, which silently beat
# the ini value and ran a suite against development infrastructure. Passing --ds
# through addopts uses the highest-precedence slot, so the test settings win
# regardless of the environment. An explicit --ds on the command line still
# overrides this, which is intentional.
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
markers =
    slow: spawns a subprocess pytest run; seconds rather than milliseconds
addopts = --ds=config.settings.test --reuse-db -v
