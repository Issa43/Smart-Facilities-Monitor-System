# إعداد ByteTrack الخاص بمشروع SFMS — نسخة محلية كي لا نعدّل ملفات حزمة ultralytics
# (أي تحديث للحزمة يمحو التعديل، وهو يؤثر على كل مشروع آخر على الجهاز).

tracker_type: bytetrack
track_high_thresh: 0.25   # عتبة المطابقة في المرحلة الأولى
track_low_thresh: 0.1     # عتبة المرحلة الثانية (الكشوفات ضعيفة الثقة)
new_track_thresh: 0.25    # أقل ثقة لبدء مسار جديد

# القيمة الافتراضية 30 إطاراً = 1.25 ثانية فقط عند 24fps.
# في هذا المشهد يختفي المارّ خلف العمود الضخم نحو 2.8 ثانية (68 إطاراً)،
# فكان المسار يُحذف نهائياً ويعود الشخص برقم جديد (P3 مات عند الإطار 45
# وعاد كـ P27 عند الإطار 113). 90 إطاراً = 3.75 ثانية تغطي العمود بهامش.
track_buffer: 90

match_thresh: 0.8         # حدّ تشابه الإسناد — تُرك على الافتراضي عمداً:
                          # رفعه إلى 0.9 يقلّل الأرقام أكثر لكنه يسمح بمطابقات
                          # أضعف، أي خطر إسناد هوية شخص إلى آخر في الزحام
fuse_score: True
