services:
  backend:
    image: ${BACKEND_IMAGE:-sflms-backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
    restart: always

  celery_worker:
    image: ${BACKEND_IMAGE:-sflms-backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    restart: always

  celery_beat:
    image: ${BACKEND_IMAGE:-sflms-backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    restart: always

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../Smart-Facility-Platform-main-integrated}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: ${FRONTEND_IMAGE:-sflms-frontend}:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - sflms_internal
      - sflms_edge

  postgres:
    restart: always

  redis:
    restart: always

networks:
  sflms_edge:
    driver: bridge
